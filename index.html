<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win Lose Wheel</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg1: #040814;
      --bg2: #0b1020;
      --panel: rgba(255,255,255,0.08);
      --panelBorder: rgba(255,255,255,0.14);
      --text: #f8fafc;
      --muted: rgba(255,255,255,0.68);
      --win: #00e676;
      --lose: #ff1744;
      --shadow: 0 24px 70px rgba(0,0,0,0.35);
      --sidebar-w: 320px;
      --layout-gap: 10px;
      --page-pad: 10px;
      --topbar-h: 62px;

      --sidebar-bg:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)),
        linear-gradient(180deg, rgba(14,22,40,0.94), rgba(8,14,28,0.9));
      --sidebar-border: rgba(255,255,255,0.16);
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #1a2440 0%, transparent 34%),
        radial-gradient(circle at bottom right, #111827 0%, transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: visible;
    }

    .topbar {
      position: absolute;
      top: var(--page-pad);
      right: var(--page-pad);
      width: var(--sidebar-w);
      height: var(--topbar-h);
      z-index: 20;
      display: flex;
      align-items: stretch;
    }

    .mode-group {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 8px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow: 0 14px 34px rgba(0,0,0,0.22);
    }

    .mode-btn {
      width: 100%;
      min-width: 0;
      height: 46px;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: clamp(12px, 1vw, 14px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      color: white;
      background: transparent;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .mode-btn:hover { transform: translateY(-1px); }

    .mode-btn.active-win {
      background: rgba(0,230,118,0.18);
      box-shadow: inset 0 0 0 1px rgba(0,230,118,0.35), 0 0 18px rgba(0,230,118,0.18);
    }

    .mode-btn.active-lose {
      background: rgba(255,23,68,0.18);
      box-shadow: inset 0 0 0 1px rgba(255,23,68,0.35), 0 0 18px rgba(255,23,68,0.18);
    }

    .mode-btn.active-random {
      background: linear-gradient(135deg, rgba(0,230,118,0.18), rgba(255,23,68,0.18));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.18),
        0 0 18px rgba(255,255,255,0.12);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 30px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .side-panel {
      position: absolute;
      top: calc(var(--page-pad) + var(--topbar-h) + var(--layout-gap));
      right: var(--page-pad);
      width: var(--sidebar-w);
      bottom: var(--page-pad);
      height: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      z-index: 10;
      background: var(--sidebar-bg);
      border: 1px solid var(--sidebar-border);
      border-radius: 32px;
      box-shadow:
        0 24px 70px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 0 0 1px rgba(255,255,255,0.03);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      isolation: isolate;
      min-height: 0;
    }

    .side-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at top right, rgba(0,229,255,0.10), transparent 30%),
        radial-gradient(circle at top left, rgba(124,58,237,0.16), transparent 38%);
      pointer-events: none;
      z-index: 0;
    }

    .side-panel > * {
      position: relative;
      z-index: 1;
    }

    .wheel-panel {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .wheel-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      padding: var(--page-pad);
    }

    .wheel-click-area {
      position: relative;
      --sidebar-space: calc(var(--sidebar-w) + var(--layout-gap) + (var(--page-pad) * 2));
      --wheel-size: min(
        calc(100vw - (var(--sidebar-space) * 2)),
        calc(100dvh - (var(--page-pad) * 2) - 24px),
        1100px
      );
      width: max(280px, var(--wheel-size));
      height: max(280px, var(--wheel-size));
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 50%;
      background: transparent;
      overflow: visible;
      margin: 0 auto;
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -4px);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: clamp(20px, 3.2vmin, 36px) solid transparent;
      border-right: clamp(20px, 3.2vmin, 36px) solid transparent;
      border-top: clamp(36px, 6vmin, 72px) solid white;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
      pointer-events: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .winner-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,255,255,0.84));
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 14px;
      box-shadow: 0 20px 52px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.95);
      border: 2px solid rgba(255,255,255,0.85);
      pointer-events: none;
      overflow: hidden;
    }

    .winner-title {
      font-size: clamp(9px, 0.8vw, 11px);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(15,23,42,0.58);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .winner-name {
      font-size: clamp(22px, 2.2vw, 38px);
      font-weight: 700;
      line-height: 1.02;
      word-break: break-word;
      max-width: 100%;
    }

    .winner-mode {
      margin-top: 8px;
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.08);
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .winner-mode.hidden {
      display: none;
    }

    .winner-win .winner-name,
    .winner-win .winner-mode { color: var(--win); }

    .winner-lose .winner-name,
    .winner-lose .winner-mode { color: var(--lose); }

    .winner-idle .winner-name,
    .winner-idle .winner-mode { color: #0f172a; }

    .winner-random .winner-name,
    .winner-random .winner-mode { color: #0f172a; }

    .side-panel h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 4px 18px rgba(0,0,0,0.30);
      flex-shrink: 0;
    }

    .sub {
      margin: 0;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
      text-align: center;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      min-height: 126px;
      height: 126px;
      max-height: 126px;
      flex: 0 0 auto;
      resize: none;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      color: white;
      padding: 16px 16px;
      font-size: 14px;
      line-height: 1.5;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      outline: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 10px 24px rgba(0,0,0,0.18);
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    textarea::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
      background: transparent;
    }

    textarea:focus {
      border-color: rgba(0,229,255,0.30);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 3px rgba(0,229,255,0.08),
        0 14px 30px rgba(0,0,0,0.24);
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.42);
      font-weight: 600;
    }

    .side-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      flex-shrink: 0;
    }

    .btn,
    .side-actions .btn {
      width: 100%;
      min-width: 0;
      height: auto;
      padding: 12px 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.10);
      color: #eef2ff;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 8px 20px rgba(0,0,0,0.16);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn:hover,
    .side-actions .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.07));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 14px 26px rgba(0,0,0,0.22);
    }

    .history-wrap {
      margin-top: 2px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 14px;
      flex: 1 1 280px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 10px 24px rgba(0,0,0,0.16);
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .history-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #f8fafc;
    }

    .history-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 22px;
      scroll-padding-bottom: 22px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .history-list::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
      background: transparent;
    }

    .history-item {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 11px 12px;
      font-size: 13px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 6px 18px rgba(0,0,0,0.14);
    }

    .history-item:last-child {
      margin-bottom: 8px;
    }

    .history-main { min-width: 0; }

    .history-name {
      font-weight: 800;
      font-size: 13px;
      word-break: break-word;
      color: #f8fafc;
    }

    .history-meta {
      color: rgba(255,255,255,0.52);
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .tag {
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.10);
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .tag.win {
      color: #86ffb5;
      background: rgba(0,230,118,0.12);
    }

    .tag.lose {
      color: #ff9aab;
      background: rgba(255,23,68,0.12);
    }

    .empty-history {
      color: rgba(255,255,255,0.48);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 2px;
      text-align: center;
    }

    .center-banner-wrap {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: none;
      padding: 18px;
    }

    .center-banner-wrap.show {
      display: flex;
    }

    .result-banner {
      width: min(760px, 100%);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(12,18,32,0.92), rgba(18,27,46,0.88));
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 22px 60px rgba(0,0,0,0.42);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      pointer-events: auto;
    }

    .banner-left {
      min-width: 0;
    }

    .banner-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.72);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .banner-name {
      font-size: clamp(30px, 3.2vw, 44px);
      font-weight: 800;
      line-height: 1.05;
      word-break: break-word;
      color: #ffffff;
      text-shadow: 0 3px 14px rgba(0,0,0,0.35);
    }

    .banner-name.win { color: #8cffb1; }
    .banner-name.lose { color: #ff8ea2; }

    .banner-right {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .banner-right .btn {
      flex: 1;
      min-width: 120px;
    }

    .btn-primary {
      color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    .btn-primary.win {
      background: linear-gradient(135deg, #00b84f, #00e676);
      box-shadow: 0 8px 24px rgba(0,230,118,0.28);
    }

    .btn-primary.lose {
      background: linear-gradient(135deg, #ff4d6d, #ff1744);
      box-shadow: 0 8px 24px rgba(255,23,68,0.28);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 18px;
      top: -20px;
      opacity: 0.95;
      pointer-events: none;
      z-index: 9998;
      animation: confettiFall linear forwards;
      will-change: transform, opacity;
    }

    @keyframes confettiFall {
      0% {
        transform: translate3d(0, -10px, 0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--driftX), 110vh, 0) rotate(900deg);
        opacity: 0.95;
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 9999;
    }

    .overlay.show {
      display: flex;
    }

    .lose-x {
      position: relative;
      width: 70vmin;
      height: 70vmin;
      transform: scale(3.8);
      opacity: 0;
      filter: drop-shadow(0 0 20px rgba(255, 40, 40, 0.9)) drop-shadow(0 0 46px rgba(255, 40, 40, 0.5));
      animation: xShrinkIn 1000ms cubic-bezier(.12,.82,.2,1) forwards;
    }

    .lose-x::before,
    .lose-x::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18%;
      height: 92%;
      border-radius: 999px;
      transform-origin: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,80,80,0.98) 45%, rgba(255,0,0,0.96));
      box-shadow: inset 0 0 16px rgba(255,255,255,0.45), 0 0 50px rgba(255, 0, 0, 0.88), 0 0 100px rgba(255, 0, 0, 0.55);
    }

    .lose-x::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .lose-x::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    @keyframes xShrinkIn {
      0% {
        transform: scale(4.3);
        opacity: 0;
      }
      18% {
        opacity: 1;
      }
      100% {
        transform: scale(0.62);
        opacity: 1;
      }
    }

    .side-panel,
    .history-list,
    textarea {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .side-panel::-webkit-scrollbar,
    .history-list::-webkit-scrollbar,
    textarea::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
      background: transparent;
    }

    .side-panel::-webkit-scrollbar-thumb,
    .history-list::-webkit-scrollbar-thumb,
    textarea::-webkit-scrollbar-thumb {
      background: transparent;
    }

    .side-panel::-webkit-scrollbar-track,
    .history-list::-webkit-scrollbar-track,
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }

    @media (max-width: 1240px) {
      :root {
        --sidebar-w: 290px;
      }
    }

    @media (max-width: 1080px) {
      body {
        overflow: auto;
      }

      .topbar {
        position: static;
        width: 100%;
        height: auto;
        order: 1;
      }

      .mode-group {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .wheel-panel {
        position: relative;
        inset: auto;
        right: auto;
        min-height: min(92vw, 760px);
        order: 2;
      }

      .wheel-stage {
        position: relative;
        min-height: min(92vw, 760px);
        padding: 0;
      }

      .wheel-click-area {
        --wheel-size: min(calc(100vw - 20px), 760px);
        width: max(280px, var(--wheel-size));
        height: max(280px, var(--wheel-size));
        margin: 0 auto;
      }

      .side-panel {
        position: static;
        width: 100%;
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        order: 3;
      }

      .history-wrap {
        min-height: 280px;
      }
    }

    @media (max-width: 680px) {
      .wheel-panel {
        min-height: min(96vw, 560px);
      }

      .wheel-stage {
        min-height: min(96vw, 560px);
      }

      .wheel-click-area {
        --wheel-size: min(calc(100vw - 20px), 94vmin, 560px);
        width: max(260px, var(--wheel-size));
        height: max(260px, var(--wheel-size));
      }

      .winner-center {
        width: 150px;
        height: 150px;
      }

      .result-banner {
        flex-direction: column;
        align-items: stretch;
      }

      .banner-right {
        width: 100%;
        flex-wrap: wrap;
      }

      .banner-right .btn {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="mode-group">
        <button class="mode-btn active-win" id="winModeBtn" type="button">Win</button>
        <button class="mode-btn" id="loseModeBtn" type="button">Lose</button>
        <button class="mode-btn" id="randomModeBtn" type="button">Random</button>
      </div>
    </div>

    <div class="wheel-panel">
      <div class="wheel-stage">
        <div class="wheel-click-area" id="wheelClickArea" title="Click wheel to spin">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="860" height="860"></canvas>

          <div class="winner-center winner-idle" id="winnerCenter">
            <div class="winner-title">Selected</div>
            <div class="winner-name" id="winnerName">Spin Me</div>
            <div class="winner-mode hidden" id="winnerMode"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel side-panel">
      <h1>Enter Names</h1>
      <p class="sub">One name per line. The wheel slowly rotates until you click it to spin.</p>

      <textarea id="namesInput" placeholder="John&#10;Sarah&#10;Mike&#10;Emma"></textarea>

      <div class="side-actions">
        <button class="btn btn-secondary" id="sortBtn">Sort</button>
        <button class="btn btn-secondary" id="shuffleBtn">Shuffle</button>
        <button class="btn btn-secondary" id="clearHistoryBtn">Clear History</button>
        <button class="btn btn-secondary" id="undoBtn">Undo</button>
        <button class="btn btn-secondary" id="redoBtn">Redo</button>
        <button class="btn btn-secondary" id="clearListBtn">Clear List</button>
      </div>

      <div class="history-wrap">
        <div class="history-head">
          <h2>History</h2>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

  <div class="center-banner-wrap" id="centerBannerWrap">
    <div class="result-banner">
      <div class="banner-left">
        <div class="banner-label">Chosen Name</div>
        <div class="banner-name" id="bannerName">Name</div>
      </div>
      <div class="banner-right">
        <button class="btn btn-secondary" id="skipBtn">Skip</button>
        <button class="btn btn-primary lose" id="removeBtn">Remove</button>
        <button class="btn btn-secondary" id="removeAllBtn" style="display:none;">Remove All</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="loseOverlay">
    <div class="lose-x"></div>
  </div>

  <script>
    const STORAGE_KEY = "wheelWinLoseSimple_v20";

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    const namesInput = document.getElementById("namesInput");
    const removeBtn = document.getElementById("removeBtn");
    const removeAllBtn = document.getElementById("removeAllBtn");
    const skipBtn = document.getElementById("skipBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const clearListBtn = document.getElementById("clearListBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const sortBtn = document.getElementById("sortBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const wheelClickArea = document.getElementById("wheelClickArea");

    const winModeBtn = document.getElementById("winModeBtn");
    const loseModeBtn = document.getElementById("loseModeBtn");
    const randomModeBtn = document.getElementById("randomModeBtn");

    const winnerCenter = document.getElementById("winnerCenter");
    const winnerNameEl = document.getElementById("winnerName");
    const winnerModeEl = document.getElementById("winnerMode");

    const centerBannerWrap = document.getElementById("centerBannerWrap");
    const bannerName = document.getElementById("bannerName");
    const historyList = document.getElementById("historyList");
    const loseOverlay = document.getElementById("loseOverlay");

    const defaultText = `John
Sarah
Mike
Emma`;

    let entries = [];
    let history = [];
    let spinning = false;
    let currentRotation = 0;
    let selectedEntry = null;
    let selectedMode = "Win";
    let modeSelection = "Win";
    let idleAnimationFrame = null;
    let idleRotationSpeed = 0.0035;
    let currentSpinMode = "Win";
    let undoStack = [];
    let redoStack = [];
    let inputUndoArmed = true;
    let pendingNamesText = null;

    const palette = [
      "#ff1744",
      "#ff9100",
      "#ffd600",
      "#00e676",
      "#00e5ff",
      "#2979ff",
      "#651fff",
      "#d500f9",
      "#ff3d00",
      "#76ff03",
      "#00b0ff",
      "#ff4081"
    ];

    function cloneEntries(list) {
      return list.map(item => ({ ...item }));
    }

    function cloneHistory(list) {
      return list.map(item => ({ ...item }));
    }

    function createSnapshot() {
      return {
        entries: cloneEntries(entries),
        history: cloneHistory(history),
        namesText: entries.map(e => e.name).join("\n"),
        selectedEntry: selectedEntry ? { ...selectedEntry } : null,
        selectedMode,
        modeSelection,
        currentRotation,
        pendingNamesText
      };
    }

    function getSelectedNameCount() {
      if (!selectedEntry) return 0;
      return entries.filter(e => e.name === selectedEntry.name).length;
    }

    function updateRemoveAllButton() {
      const count = getSelectedNameCount();
      removeAllBtn.style.display = count > 1 ? "inline-flex" : "none";
      removeAllBtn.textContent = count > 1 ? `Remove All (${count})` : "Remove All";
    }

    function saveState() {
      const state = {
        namesText: namesInput.value,
        history,
        currentRotation,
        selectedMode,
        modeSelection,
        selectedEntry,
        pendingNamesText
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          namesInput.value = defaultText;
          return;
        }

        const state = JSON.parse(raw);
        namesInput.value = state.namesText || defaultText;
        history = Array.isArray(state.history) ? state.history : [];
        currentRotation = typeof state.currentRotation === "number" ? state.currentRotation : 0;
        selectedMode = state.selectedMode === "Lose" ? "Lose" : "Win";
        modeSelection = state.modeSelection === "Random"
          ? "Random"
          : (state.modeSelection === "Lose" ? "Lose" : "Win");
        selectedEntry = state.selectedEntry || null;
        pendingNamesText = typeof state.pendingNamesText === "string" ? state.pendingNamesText : null;
      } catch {
        namesInput.value = defaultText;
      }
    }

    function restoreSnapshot(snapshot) {
      entries = cloneEntries(snapshot.entries);
      history = cloneHistory(snapshot.history);
      selectedEntry = snapshot.selectedEntry ? { ...snapshot.selectedEntry } : null;
      selectedMode = snapshot.selectedMode;
      modeSelection = snapshot.modeSelection;
      currentRotation = snapshot.currentRotation;
      pendingNamesText = null;

      namesInput.value = entries.map(e => e.name).join("\n");

      updateModeButtons();
      updateRemoveButtonTheme();
      renderHistory();
      updateWinnerDisplay();
      drawWheel(currentRotation);
      updateCenterSize();

      if (selectedEntry) {
        updateBanner();
      } else {
        hideBanner();
      }

      inputUndoArmed = true;
      saveState();
    }

    function pushUndoState() {
      undoStack.push(createSnapshot());
      redoStack = [];
      if (undoStack.length > 50) undoStack.shift();
    }

    function undoLastAction() {
      if (!undoStack.length) return;
      redoStack.push(createSnapshot());
      const prev = undoStack.pop();
      restoreSnapshot(prev);
    }

    function redoLastAction() {
      if (!redoStack.length) return;
      undoStack.push(createSnapshot());
      const next = redoStack.pop();
      restoreSnapshot(next);
    }

    function parseNames(text) {
      return text
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .map((name, idx) => ({
          id: `${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 7)}`,
          name
        }));
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<div class="empty-history">No history yet.</div>';
        return;
      }

      historyList.innerHTML = history
        .slice()
        .reverse()
        .map(item => `
          <div class="history-item">
            <div class="history-main">
              <div class="history-name">${escapeHtml(item.name)}</div>
              <div class="history-meta">${escapeHtml(item.time)}</div>
            </div>
            <div class="tag ${item.mode.toLowerCase()}">${item.mode}</div>
          </div>
        `)
        .join("");
    }

    function updateRemoveButtonTheme() {
      removeBtn.classList.remove("win", "lose");
      removeBtn.classList.add(selectedMode === "Win" ? "win" : "lose");
    }

    function showWinnerMode(text) {
      winnerModeEl.textContent = text || "";
      winnerModeEl.classList.toggle("hidden", !text);
    }

    function updateModeButtons() {
      winModeBtn.classList.toggle("active-win", modeSelection === "Win");
      loseModeBtn.classList.toggle("active-lose", modeSelection === "Lose");
      randomModeBtn.classList.toggle("active-random", modeSelection === "Random");
    }

    function setMode(mode) {
      modeSelection = mode === "Random" ? "Random" : (mode === "Lose" ? "Lose" : "Win");

      if (modeSelection === "Win") selectedMode = "Win";
      if (modeSelection === "Lose") selectedMode = "Lose";

      updateModeButtons();

      if (selectedEntry) {
        updateWinnerDisplay();
        updateBanner();
      } else {
        updateWinnerDisplay();
      }

      saveState();
    }

    function rebuildEntries(options = {}) {
      const { preserveSelectedEntry = false } = options;

      entries = parseNames(namesInput.value);

      if (selectedEntry && !preserveSelectedEntry) {
        const exists = entries.some(e => e.name === selectedEntry.name);
        if (!exists) {
          selectedEntry = null;
          hideBanner();
        }
      }

      updateWinnerDisplay();
      drawWheel(currentRotation);
      updateCenterSize();
      saveState();
    }

    function applyPendingNamesIfNeeded() {
      if (pendingNamesText === null) return;

      const pendingText = pendingNamesText;
      pendingNamesText = null;
      namesInput.value = pendingText;

      rebuildEntries({ preserveSelectedEntry: true });

      if (selectedEntry) {
        updateWinnerDisplay();
        updateBanner();
      }
    }

    function queueOrApplyNamesChange() {
      if (spinning) {
        pendingNamesText = namesInput.value;
        saveState();
        return;
      }
      rebuildEntries();
    }

    function syncTextarea() {
      namesInput.value = entries.map(e => e.name).join("\n");
      pendingNamesText = null;
      saveState();
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const displayWidth = Math.max(1, Math.round(rect.width * dpr));
      const displayHeight = Math.max(1, Math.round(rect.height * dpr));

      if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
        canvas.width = displayWidth;
        canvas.height = displayHeight;
      }
    }

    function updateCenterSize() {
      const wheelSize = Math.min(wheelClickArea.clientWidth, wheelClickArea.clientHeight);
      const minSize = window.innerWidth <= 680 ? 120 : 150;
      const maxSize = window.innerWidth <= 680 ? 190 : 235;
      const size = Math.max(minSize, Math.min(wheelSize * 0.28, maxSize));
      winnerCenter.style.width = `${size}px`;
      winnerCenter.style.height = `${size}px`;
    }

    function drawWheel(rotation = currentRotation) {
      resizeCanvas();
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(w, h) / 2 - 22;

      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 10;
      ctx.stroke();

      const drawEntries = entries.length ? entries : [{ name: "Add Names" }];
      const count = drawEntries.length;
      const arc = (Math.PI * 2) / count;

      for (let i = 0; i < count; i++) {
        const start = rotation + i * arc - Math.PI / 2;
        const end = start + arc;
        const item = drawEntries[i];

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.82)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "white";
        ctx.font = "bold 28px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 6;

        const text = item.name.length > 18 ? item.name.slice(0, 18) + "…" : item.name;
        ctx.fillText(text, radius - 34, 8);
        ctx.restore();
      }
    }

    function normalizeAngle(a) {
      const two = Math.PI * 2;
      return ((a % two) + two) % two;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function getWinnerIndex(rotation) {
      if (!entries.length) return -1;
      const arc = (Math.PI * 2) / entries.length;
      const adjusted = normalizeAngle(-rotation);
      return Math.floor(adjusted / arc) % entries.length;
    }

    function getPointerEntry(rotation) {
      const index = getWinnerIndex(rotation);
      return index >= 0 ? entries[index] : null;
    }

    function getDisplayModeLabel() {
      if (!selectedEntry) return "";
      return modeSelection === "Random" ? `${selectedMode} (Random)` : selectedMode;
    }

    function updateWinnerDisplay() {
      winnerCenter.classList.remove("winner-idle", "winner-win", "winner-lose", "winner-random");

      if (!selectedEntry) {
        winnerCenter.classList.add(modeSelection === "Random" ? "winner-random" : "winner-idle");
        winnerNameEl.textContent = entries.length ? "Spin Me" : "Add Names";
        showWinnerMode(modeSelection === "Random" ? "Random" : "");
        return;
      }

      winnerCenter.classList.add(selectedMode === "Win" ? "winner-win" : "winner-lose");
      winnerNameEl.textContent = selectedEntry.name;
      showWinnerMode(getDisplayModeLabel());
    }

    function updateBanner() {
      if (!selectedEntry) {
        hideBanner();
        return;
      }

      bannerName.textContent = selectedEntry.name;
      bannerName.classList.remove("win", "lose");
      bannerName.classList.add(selectedMode.toLowerCase());
      updateRemoveButtonTheme();
      updateRemoveAllButton();
      centerBannerWrap.classList.add("show");
    }

    function hideBanner() {
      centerBannerWrap.classList.remove("show");
    }

    function addHistoryItem(entry) {
      const time = new Date().toLocaleString();
      history.push({ name: entry.name, mode: selectedMode, time });
      if (history.length > 100) history = history.slice(-100);
      renderHistory();
      saveState();
    }

    function playConfetti() {
      const colors = ["#00e676", "#00b0ff", "#ffd600", "#ff1744", "#ffffff", "#651fff"];
      for (let i = 0; i < 140; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty("--driftX", `${(Math.random() * 240) - 120}px`);
        piece.style.animationDuration = `${1800 + Math.random() * 1800}ms`;
        piece.style.animationDelay = `${Math.random() * 220}ms`;

        if (Math.random() > 0.5) {
          piece.style.borderRadius = "999px";
          piece.style.width = "8px";
          piece.style.height = "8px";
        } else {
          piece.style.borderRadius = "2px";
        }

        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4200);
      }
    }

    function playLoseX() {
      loseOverlay.classList.add("show");
      const x = loseOverlay.querySelector(".lose-x");
      x.style.animation = "none";
      void x.offsetWidth;
      x.style.animation = "xShrinkIn 1000ms cubic-bezier(.12,.82,.2,1) forwards";
      setTimeout(() => loseOverlay.classList.remove("show"), 1200);
    }

    function playSelectedAnimation() {
      if (selectedMode === "Win") {
        playConfetti();
      } else {
        playLoseX();
      }
    }

    function stopIdleSpin() {
      if (idleAnimationFrame) {
        cancelAnimationFrame(idleAnimationFrame);
        idleAnimationFrame = null;
      }
    }

    function startIdleSpin() {
      stopIdleSpin();

      function step() {
        if (spinning) {
          idleAnimationFrame = null;
          return;
        }

        currentRotation += idleRotationSpeed;
        drawWheel(currentRotation);
        idleAnimationFrame = requestAnimationFrame(step);
      }

      idleAnimationFrame = requestAnimationFrame(step);
    }

    function notifySpinTriggered() {
      if (window.parent) {
        window.parent.postMessage({ type: "spinTriggered" }, "*");
      }
    }

    function spinWheel() {
      if (spinning || entries.length < 1) return;

      currentSpinMode = modeSelection === "Random"
        ? (Math.random() > 0.5 ? "Win" : "Lose")
        : modeSelection;

      selectedMode = currentSpinMode;

      stopIdleSpin();
      selectedEntry = null;
      hideBanner();
      winnerCenter.classList.remove("winner-win", "winner-lose");
      winnerCenter.classList.add(modeSelection === "Random" ? "winner-random" : "winner-idle");
      showWinnerMode(modeSelection === "Random" ? "Random" : "");
      spinning = true;

      notifySpinTriggered();

      const extraTurns = (Math.PI * 2) * (7 + Math.random() * 2);
      const randomOffset = Math.random() * Math.PI * 2;
      const startRotation = currentRotation;
      const finalRotation = startRotation + extraTurns + randomOffset;
      const duration = 5200;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(t);

        currentRotation = startRotation + (finalRotation - startRotation) * eased;
        drawWheel(currentRotation);

        const hoveredEntry = getPointerEntry(currentRotation);
        winnerNameEl.textContent = hoveredEntry ? hoveredEntry.name : "Spin Me";
        showWinnerMode(modeSelection === "Random" ? "Random" : "");

        if (t < 1) {
          requestAnimationFrame(animate);
          return;
        }

        currentRotation = finalRotation;
        drawWheel(currentRotation);

        const finalIndex = getWinnerIndex(currentRotation);
        selectedEntry = finalIndex >= 0 ? entries[finalIndex] : null;

        updateWinnerDisplay();
        updateBanner();
        if (selectedEntry) addHistoryItem(selectedEntry);
        playSelectedAnimation();
        saveState();

        spinning = false;
        applyPendingNamesIfNeeded();
        startIdleSpin();
      }

      requestAnimationFrame(animate);
    }

    function removeSelected() {
      if (!selectedEntry) return;

      pushUndoState();

      const selectedIndex = entries.findIndex(e => e.name === selectedEntry.name);
      if (selectedIndex === -1) return;

      entries.splice(selectedIndex, 1);

      selectedEntry = null;
      syncTextarea();
      hideBanner();
      updateWinnerDisplay();
      drawWheel(currentRotation);
      updateCenterSize();
      saveState();
    }

    function removeAllSelected() {
      if (!selectedEntry) return;

      pushUndoState();

      const selectedName = selectedEntry.name;
      entries = entries.filter(e => e.name !== selectedName);

      selectedEntry = null;
      syncTextarea();
      hideBanner();
      updateWinnerDisplay();
      drawWheel(currentRotation);
      updateCenterSize();
      saveState();
    }

    function skipSelected() {
      if (!selectedEntry) return;
      selectedEntry = null;
      hideBanner();
      updateWinnerDisplay();
      saveState();
    }

    function clearHistory() {
      if (!history.length) return;

      pushUndoState();

      history = [];
      renderHistory();
      saveState();
    }

    function clearList() {
      if (!namesInput.value.trim() && !entries.length) return;

      pushUndoState();

      namesInput.value = "";
      selectedEntry = null;
      hideBanner();

      if (spinning) {
        pendingNamesText = "";
        updateWinnerDisplay();
        saveState();
        return;
      }

      rebuildEntries();
    }

    function sortEntries() {
      if (spinning || entries.length < 2) return;

      pushUndoState();

      entries.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
      selectedEntry = null;
      hideBanner();
      syncTextarea();
      updateWinnerDisplay();
      drawWheel(currentRotation);
    }

    function shuffleEntries() {
      if (spinning || entries.length < 2) return;

      pushUndoState();

      for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
      }

      selectedEntry = null;
      hideBanner();
      syncTextarea();
      updateWinnerDisplay();
      drawWheel(currentRotation);
    }

    winModeBtn.addEventListener("click", () => setMode("Win"));
    loseModeBtn.addEventListener("click", () => setMode("Lose"));
    randomModeBtn.addEventListener("click", () => setMode("Random"));
    wheelClickArea.addEventListener("click", spinWheel);
    removeBtn.addEventListener("click", removeSelected);
    skipBtn.addEventListener("click", skipSelected);
    removeAllBtn.addEventListener("click", removeAllSelected);
    clearHistoryBtn.addEventListener("click", clearHistory);
    clearListBtn.addEventListener("click", clearList);
    undoBtn.addEventListener("click", undoLastAction);
    redoBtn.addEventListener("click", redoLastAction);
    sortBtn.addEventListener("click", sortEntries);
    shuffleBtn.addEventListener("click", shuffleEntries);

    namesInput.addEventListener("focus", () => {
      inputUndoArmed = true;
    });

    namesInput.addEventListener("input", () => {
      if (inputUndoArmed) {
        pushUndoState();
        inputUndoArmed = false;
      }
      queueOrApplyNamesChange();
    });

    namesInput.addEventListener("blur", () => {
      inputUndoArmed = true;
    });

    window.addEventListener("resize", () => {
      updateCenterSize();
      drawWheel(currentRotation);
    });

    loadState();
    updateModeButtons();
    updateRemoveButtonTheme();
    renderHistory();
    rebuildEntries();

    if (selectedEntry) {
      updateWinnerDisplay();
      updateBanner();
    } else {
      hideBanner();
      updateWinnerDisplay();
    }

    updateCenterSize();
    drawWheel(currentRotation);
    startIdleSpin();
    saveState();
    window.parent.postMessage({ type: "pageLoadedFromHtml" }, "*");
  </script>
</body>
</html>
